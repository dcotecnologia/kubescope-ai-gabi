id = "kubescope.gabi"
name = "Gabi - AI Assistant"
version = "1.5.1"
api = "0"
min_app = "2.9.0"
entry = "kubescope.gabi:activate"
description = "Ask about your cluster in plain language: she reads workloads, events, logs and live CPU and memory, explains what is wrong and how to fix it, and takes you to the right list or tab. Changes (scale, edit) only in write mode, each one confirmed. Uses the coding assistant you already signed in to."
author = "DCO Tecnologia"
permissions = ["cluster.read", "cluster.write", "subprocess", "ui.window", "ui.settings", "cli"]
commands = ["chat", "assistant"]
