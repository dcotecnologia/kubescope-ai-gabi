[project]
name = "kubescope-gabi"
version = "1.0.0"
description = "Gabi, the assistant of KubeScope: ask about your cluster from a coding assistant installed on your computer"
readme = "README.md"
license = "MIT"
authors = [{ name = "Danilo Carolino", email = "danilogcarolino@gmail.com" }]
requires-python = ">=3.15,<3.16"
# Gabi runs inside KubeScope, so it depends on it, as a pytest plugin depends on
# pytest. Everything else it needs (Qt, the Kubernetes client) comes with it.
dependencies = ["kubescope>=1.12.0"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pyright>=1.1.414",
    "ruff>=0.17.5",
]

[tool.uv.sources]
# while the extension API is unstable (api = "0"), develop against a checkout of
# the app next to this one
kubescope = { path = "../kubescope", editable = true }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = "--import-mode=importlib --log-level=WARN --strict-markers --tb=short"

[tool.pyright]
include = ["src", "tests"]
exclude = ["**/__pycache__"]
pythonVersion = "3.15"
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 88
target-version = "py315"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
